  <!--
    Icon sprite. Drawn here rather than loaded as files so the page stays
    offline-safe and `<use href="#id">` resolves within the same document.
    Inner shapes carry fill/stroke as presentation attributes because CSS
    descendant selectors do not cross the shadow tree that <use> creates.
  -->
  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
    <defs>
      <!-- CONCEPT: a core idea, held. -->
      <symbol id="sigil-concept" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="7.6"/>
        <circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/>
      </symbol>

      <!-- ENGINEERING: a node opened along its axis. -->
      <symbol id="sigil-engineering" viewBox="0 0 24 24">
        <path d="M12 3.4 20.6 12 12 20.6 3.4 12Z"/>
        <path d="M7.2 12h9.6"/>
      </symbol>

      <!-- COPILOT: two seats, one heading. -->
      <symbol id="sigil-copilot" viewBox="0 0 24 24">
        <path d="M8.6 12h6.6"/>
        <circle cx="6.4" cy="12" r="2.2" fill="currentColor" stroke="none"/>
        <circle cx="17.4" cy="12" r="2.6"/>
      </symbol>

      <symbol id="chevron-right" viewBox="0 0 24 24">
        <path d="M9 5.5 15.5 12 9 18.5"/>
      </symbol>

      <symbol id="arrow-down" viewBox="0 0 24 24">
        <path d="M12 4.5v14.5M6.5 13.5 12 19l5.5-5.5"/>
      </symbol>

      <symbol id="scroll-cue" viewBox="0 0 24 24">
        <path d="M12 2.5v13"/>
        <path d="M7.5 11 12 15.5 16.5 11"/>
        <path d="M8 20.5h8"/>
      </symbol>

      <symbol id="close" viewBox="0 0 24 24">
        <path d="M6 6l12 12M18 6 6 18"/>
      </symbol>

      <symbol id="map" viewBox="0 0 24 24">
        <circle cx="12" cy="4.6" r="2.1"/>
        <circle cx="5.6" cy="19.4" r="2.1"/>
        <circle cx="18.4" cy="19.4" r="2.1"/>
        <path d="M12 6.7v5.6M12 12.3 6.6 17.6M12 12.3l5.4 5.3"/>
      </symbol>

      <symbol id="index" viewBox="0 0 24 24">
        <path d="M4 6.5h16M4 12h16M4 17.5h10"/>
      </symbol>

      <symbol id="motion" viewBox="0 0 24 24">
        <path d="M3.5 8.5h11M3.5 15.5h7"/>
        <circle cx="18" cy="8.5" r="2.4"/>
        <circle cx="14" cy="15.5" r="2.4"/>
      </symbol>
    </defs>
  </svg>
